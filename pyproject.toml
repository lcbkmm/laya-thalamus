[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-thalamus"
version = "0.1.0"
description = "Thalamus: Laya-powered System-1 decision router for AI Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Laya Thalamus Contributors" }]
keywords = ["laya", "thalamus", "agent", "router", "system1", "decision", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# HTTP server (thalamus serve)
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# Optional HTTP client for custom LLM wiring; built-in client uses stdlib urllib
llm = [
    "httpx>=0.27",
]
otel = [
    "opentelemetry-api>=1.20",
]
# Real System-1 weights runtime (+ fine-tune)
laya = ["laya>=0.3.0"]
train = [
    "laya>=0.3.0",
]
dev = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]
all = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "opentelemetry-api>=1.20",
    "laya>=0.3.0",
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
thalamus = "laya_thalamus.cli:main"
laya-thalamus = "laya_thalamus.cli:main"

[project.urls]
Homepage = "https://github.com/lcbkmm/laya-thalamus"
Documentation = "https://github.com/lcbkmm/laya-thalamus/blob/main/API.md"
Repository = "https://github.com/lcbkmm/laya-thalamus"
Issues = "https://github.com/lcbkmm/laya-thalamus/issues"
Changelog = "https://github.com/lcbkmm/laya-thalamus/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_thalamus = ["resources/*.yaml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
